[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tnuntia"
version = "1.0.0"
description = "Gerador de cortes, notícias e posts para redes sociais de sessões legislativas com Google Gemini e integração tVerbum."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Tiago Treter" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Communications",
]
dependencies = [
    "google-genai>=2.30.0",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2026.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
tnuntia = "tnuntia.__main__:main"

